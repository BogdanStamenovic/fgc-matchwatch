[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fgc-matchwatch"
version = "0.1.0"
description = "Find FIRST Global Challenge matches in the livestream, transcribe the commentary and turn it into per-team scouting observations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bogdan Stamenovic" }]
keywords = ["first-global", "whisper", "scouting", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
]
# yt-dlp and faster-whisper are the heavy half and the reason this is not part
# of fgc-scout. rapidfuzz does the fuzzy country matching.
dependencies = [
  "yt-dlp>=2026.8",
  "faster-whisper>=1.2,<2",
  "rapidfuzz>=3",
]

[project.optional-dependencies]
# CUDA 12 runtime libraries for CTranslate2. Without them Whisper runs on CPU.
gpu = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12>=9,<10"]
dev = [
  "pytest>=8.0,<10",
  "pytest-cov>=5.0,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<3",
]

[project.scripts]
fgc-matchwatch = "fgc_matchwatch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fgc_matchwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# bench/ holds the one-off measurement scripts behind the README numbers.
extend-exclude = ["bench"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
